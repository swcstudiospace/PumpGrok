# SIGNAL roster: 6 own tools + desk.* core eight (_core.yaml) = 14 effective.
# Contract surface: contracts/tool-rosters/** (bot-02-risk, ownership.yaml). Consumer: bot-08-signal.
# Least privilege: docs/ROSTER.md section 5 and 6; tool names from docs/TOOL_CATALOG.md.
version: 1.1.0
seat: bot-08-signal
short: signal
endpoint: /mcp/signal
scope: seat:signal
core: true
packs_allowed: false
consumers:
- bot-08-signal
tools:
- name: market.price
  kind: read
  side_effect: read
  gates: []
  description: Spot price of a token in SOL. Pre-graduation it comes from bonding-curve reserves; the
    Jupiter route price is informational only. quote_mint defaults to WSOL.
  backend: market.price
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      quote_mint:
        type: string
        minLength: 32
        maxLength: 44
      probe_amount_lamports:
        type: integer
        minimum: 1
        default: 1000000
    required:
    - mint
- name: market.ohlcv
  kind: read
  side_effect: read
  gates: []
  description: Candles aggregated locally from the trade stream at a fixed interval. Read only.
  backend: market.ohlcv
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      interval_s:
        type: integer
        enum:
        - 15
        - 60
        - 300
        default: 60
      limit:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    required:
    - mint
- name: market.liquidity
  kind: read
  side_effect: read
  gates: []
  description: Pool depth, curve progress and price impact for a given order size. Read only.
  backend: market.liquidity
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      order_size_lamports:
        type: integer
        minimum: 0
        default: 0
    required:
    - mint
- name: market.trades
  kind: read
  side_effect: read
  gates: []
  description: 'Recent trades for a mint: side, size, wallet and timestamp, with buy/sell ratio and unique
    wallet count. Read only.'
  backend: market.trades
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      limit:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
      since_ts:
        type: integer
        minimum: 0
    required:
    - mint
- name: market.holders_snapshot
  kind: read
  side_effect: read
  gates: []
  description: Holder count, top holders and concentration for a mint. Read only.
  backend: market.holders_snapshot
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
    required:
    - mint
- name: journal.append
  kind: write
  side_effect: paper-write
  gates: []
  description: Append a scored signal to the ledger as a journal_note with note_kind signal. The body
    is validated against contracts/events/journal_note.schema.json. A signal is evidence, never clearance.
  backend: journal.append
  input:
    type: object
    additionalProperties: false
    properties:
      kind:
        type: string
        enum:
        - journal_note
        description: 'Ledger kind: snake_case of an R32 type this seat may write.'
      note_kind:
        type: string
        enum:
        - signal
        description: Required when kind is journal_note.
      ticket_id:
        type: string
        pattern: ^SOL-[0-9]{8}-[0-9]{3}$
      body:
        type: object
        description: Payload for the kind; validated against its schema.
      approval_id:
        type: string
        minLength: 1
        maxLength: 128
        description: Human approval reference resolved to an ApprovalRecorded event (G-6).
      rollback_plan:
        type: string
        minLength: 1
        maxLength: 500
        description: How this write is undone or compensated if it is wrong.
    required:
    - kind
    - body
    allOf:
    - if:
        properties:
          kind:
            const: journal_note
        required:
        - kind
      then:
        required:
        - note_kind
manifest:
  id: bot-08-signal
  display: SIGNAL - Momentum Scorer
  channel: DM
  purpose: 'Entry/exit signal generation with confidence from price, volume,
    holder growth and social velocity. A signal is evidence, never clearance.'
  inputs:
  - LEAD
  - safety report
  - WHALE and SHILL signals
  - market.price
  - market.ohlcv
  - market.trades
  - market.holders_snapshot
  outputs:
  - scored signal events (JournalNote, note_kind signal) with components,
    confidence, checker approval, weakest component
  skills:
  - grokbot-pipeline
  - solana-market-data
  - momentum-signals
  - replay-and-backtest
  - verification-receipts
  - desk-doctor
  risk_budget:
    max_trade_fraction: 0
    max_token_fraction: 0
    daily_loss_halt_fraction: "0.05"
    drawdown_halt_fraction: "0.15"
    max_open_positions: 0
    max_trades_per_day: 0
    liquidity_floor_multiple: 10
    partial_fill_fraction: "0.02"
    paper_equity_sol: 10
  forbidden:
  - place orders
  - size
  - clear risk
  - override a KILL
  - use checker approval as approval
  - D7 manipulation actions
  fail_safe: 'LLM call failure after retries: rule-based score with llm_degraded
    true; missing component counts as 0.0.'
  schedule:
  - kind: event
    expr: on LEAD plus safety report
  escalation:
  - CHIEF on LLM budget exhausted or breaker open
  owned_paths:
  - src/pumpgrok/engine/scoring.py
  - src/pumpgrok/engine/analyzer.py
  - src/pumpgrok/engine/agents/**
  - skills/momentum-signals/**
  - skills/replay-and-backtest/**
  - prompts/bot-08-signal.xml
  - tests/engine/test_scoring*.py
  - .receipts/bot-08-signal/**
  receipts_dir: .receipts/bot-08-signal/
  prompt_source: prompts/bot-08-signal.xml
  writes_to_exchange: false
