# EXIT roster: 7 own tools + desk.* core eight (_core.yaml) = 15 effective.
# Contract surface: contracts/tool-rosters/** (bot-02-risk, ownership.yaml). Consumer: bot-06-exit.
# Least privilege: docs/ROSTER.md section 5 and 6; tool names from docs/TOOL_CATALOG.md.
version: 1.1.0
seat: bot-06-exit
short: exit
endpoint: /mcp/exit
scope: seat:exit
core: true
packs_allowed: false
consumers:
- bot-06-exit
tools:
- name: market.price
  kind: read
  side_effect: read
  gates: []
  description: Spot price of a token in SOL. Pre-graduation it comes from bonding-curve reserves; the
    Jupiter route price is informational only. quote_mint defaults to WSOL.
  backend: market.price
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      quote_mint:
        type: string
        minLength: 32
        maxLength: 44
      probe_amount_lamports:
        type: integer
        minimum: 1
        default: 1000000
    required:
    - mint
- name: exec.quote
  kind: read
  side_effect: read
  gates: []
  description: 'Route quote for a swap through the paper ExecutionAdapter. Informational only: the fill
    is computed from the bonding curve. Never submits anything.'
  backend: exec.quote
  input:
    type: object
    additionalProperties: false
    properties:
      input_mint:
        type: string
        minLength: 32
        maxLength: 44
      output_mint:
        type: string
        minLength: 32
        maxLength: 44
      amount:
        type: integer
        minimum: 1
        description: Lamports when input_mint is WSOL, otherwise token units.
      slippage_bps:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
    required:
    - input_mint
    - output_mint
    - amount
- name: exec.simulate
  kind: read
  side_effect: read
  gates: []
  description: Simulate a sell fill against observed liquidity. Precondition for exec.place.
  backend: exec.simulate
  input:
    type: object
    additionalProperties: false
    properties:
      ticket_id:
        type: string
        pattern: ^SOL-[0-9]{8}-[0-9]{3}$
      mint:
        type: string
        minLength: 32
        maxLength: 44
      side:
        type: string
        enum:
        - sell
      token_units:
        type: integer
        minimum: 1
        description: Token base units to sell.
      slippage_bps:
        type: integer
        minimum: 0
        maximum: 10000
        default: 100
      quote_id:
        type: string
        maxLength: 64
    required:
    - ticket_id
    - mint
    - side
    - token_units
- name: exec.place
  kind: write
  side_effect: paper-write
  gates:
  - g6
  description: 'Place exactly one paper SELL for an open position under an approved exit rule. Fails closed.
    approval_id must resolve to an ApprovalRecorded event of kind exit_rule, autonomous_paper or human_sell.
    Idempotent on (ticket_id, side, decision_id). No retry: a timeout is reported as UNKNOWN RESULT -
    reconcile by signature.'
  backend: exec.place
  input:
    type: object
    additionalProperties: false
    properties:
      ticket_id:
        type: string
        pattern: ^SOL-[0-9]{8}-[0-9]{3}$
      mint:
        type: string
        minLength: 32
        maxLength: 44
      side:
        type: string
        enum:
        - sell
      decision_id:
        type: string
        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
        description: Minted per decision (R23). Idempotency is (ticket_id, side, decision_id).
      token_units:
        type: integer
        minimum: 1
        description: Token base units to sell.
      max_slippage_bps:
        type: integer
        minimum: 0
        maximum: 10000
      quote_id:
        type: string
        maxLength: 64
      approval_id:
        type: string
        minLength: 1
        maxLength: 128
        description: Human approval reference resolved to an ApprovalRecorded event (G-6).
      rollback_plan:
        type: string
        minLength: 1
        maxLength: 500
        description: How this write is undone or compensated if it is wrong.
    required:
    - ticket_id
    - mint
    - side
    - decision_id
    - token_units
    - max_slippage_bps
    - approval_id
    - rollback_plan
- name: exec.cancel
  kind: write
  side_effect: paper-write
  gates:
  - g6
  description: Cancel one of this seat's own pending paper orders. Fails closed.
  backend: exec.cancel
  input:
    type: object
    additionalProperties: false
    properties:
      order_id:
        type: string
        pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      ticket_id:
        type: string
        pattern: ^SOL-[0-9]{8}-[0-9]{3}$
      approval_id:
        type: string
        minLength: 1
        maxLength: 128
        description: Human approval reference resolved to an ApprovalRecorded event (G-6).
      rollback_plan:
        type: string
        minLength: 1
        maxLength: 500
        description: How this write is undone or compensated if it is wrong.
    required:
    - order_id
    - ticket_id
    - approval_id
    - rollback_plan
- name: exec.positions
  kind: read
  side_effect: read
  gates: []
  description: Open and recently closed paper positions with marks, unrealised P&L and closed reason,
    plus equity and cash. Read only.
  backend: exec.positions
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      include_closed_since_ts:
        type: integer
        minimum: 0
- name: onchain.priority_fee
  kind: read
  side_effect: read
  gates: []
  description: Recommended priority fee (micro-lamports per compute unit) from recent samples, capped
    at max_micro_lamports. Read only.
  backend: onchain.priority_fee
  input:
    type: object
    additionalProperties: false
    properties:
      percentile:
        type: integer
        minimum: 0
        maximum: 100
        default: 50
      multiplier:
        type: string
        pattern: ^[0-9]+(\.[0-9]+)?$
        default: '1.2'
      max_micro_lamports:
        type: integer
        minimum: 0
        default: 50000
      accounts:
        type: array
        items:
          type: string
          minLength: 32
          maxLength: 44
        maxItems: 20
        default: []
manifest:
  id: bot-06-exit
  display: EXIT - Position Manager
  channel: DM
  purpose: 'Owns the sell side only. Evaluates pre-agreed take-profit /
    stop-loss / trailing / max-hold rules and executes paper sells through
    exec.quote to exec.simulate to exec.place (side sell).'
  inputs:
  - open positions (exec.positions)
  - market.price
  - RUG alerts
  - exit-rule config
  - ApprovalRecords of kind exit_rule, autonomous_paper or human_sell
  - fresh decision_id (ULID) per sell decision
  outputs:
  - fill events (FillRecorded, side sell) with signature, realised P and L,
    reason code, holding time, remaining balance
  skills:
  - position-monitoring
  - desk-execution-protocol
  - desk-post-trade-review
  - jupiter-routing
  - grokbot-pipeline
  - paper-broker
  - verification-receipts
  - rpc-hygiene
  - key-custody
  - desk-doctor
  risk_budget:
    max_trade_fraction: 0
    max_token_fraction: 0
    daily_loss_halt_fraction: "0.05"
    drawdown_halt_fraction: "0.15"
    max_open_positions: 0
    max_trades_per_day: 20
    liquidity_floor_multiple: 10
    partial_fill_fraction: "0.02"
    paper_equity_sol: 10
  forbidden:
  - open new positions
  - increase size
  - sell without an ApprovalRecord of an allowed kind
  - auto-sell because the dry-run engine closed
  - any live-write
  - D7 manipulation actions
  fail_safe: 'No price for blind_max_s: force-close at last_good with reason
    blind_flatten and escalate; missing data never leaves a position
    unprotected; timeout: UNKNOWN RESULT, no retry; kill-switch flatten: the
    supervisor closes positions in-process, EXIT places no competing sells.'
  schedule:
  - kind: event
    expr: exit evaluator poll on open positions in pumpgrok run
  escalation:
  - Human on every rug_alert, blind_flatten and graduated close (via CHIEF relay)
  - CHIEF closes the ticket after full exit
  owned_paths:
  - src/pumpgrok/engine/exits.py
  - skills/desk-strategy-lab/**
  - prompts/bot-06-exit.xml
  - tests/engine/test_exits*.py
  - .receipts/bot-06-exit/**
  receipts_dir: .receipts/bot-06-exit/
  prompt_source: prompts/bot-06-exit.xml
  writes_to_exchange: true
