[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grokbot-pumpfun"
version = "0.2.0"
description = "Пайплайн мемкоин-трейдинга на pump.fun с пятью агентами на Grok API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "solders>=0.21",
    "solana>=0.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
grokbot = "src.pipeline:main"

[project.urls]
Repository = "https://github.com/zostaff/grokbot-pumpfun"

[tool.setuptools]
packages = ["src", "src.agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
ignore = [
    "RUF001",  # кириллица в строках — здесь это язык проекта, а не опечатка
    "RUF002",
    "RUF003",
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "SIM117"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["^tests/", "^scripts/"]
