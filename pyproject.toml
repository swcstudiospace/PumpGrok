[project]
name = "pumpgrok"
version = "0.1.0"
description = "PumpGrok: autonomously supervised, paper-trading-by-default Solana memecoin desk (pump.fun / Jupiter / Solana RPC / x.ai Grok)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Spectrum Web Co LLC" }]
dependencies = [
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "httpx>=0.28.1,<0.29",
    "websockets>=17.3,<18",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
pumpgrok = "pumpgrok.cli:main"

[project.urls]
Homepage = "https://github.com/swcstudiospace/PumpGrok"
Repository = "https://github.com/swcstudiospace/PumpGrok"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pumpgrok"
module-root = "src"

[dependency-groups]
dev = [
    # removed with tools/ in Phase 2 (tests/test_tools_cli.py needs it)
    "requests>=2.32,<3",
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pip-audit>=2.10.1,<3",
    "types-PyYAML>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ci"]
extend-exclude = ["vendor", "prompts-assembled", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF", "S", "T20", "PL"]
ignore = [
    "PLR0913",  # many-argument constructors on pydantic settings models
    "PLR2004",  # magic values are named constants in risk/ already; tests compare literals
    "S101",     # assert is the pytest idiom; bandit still runs in security-pr.yml
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "PLR"]
"ci/**" = ["T20", "S603", "S607"]
"scripts/**" = ["T20"]
"src/pumpgrok/replay/rng.py" = ["S311"]  # FOUND-012/R27: seeded deterministic replay RNG, never crypto

[tool.ruff.lint.isort]
known-first-party = ["pumpgrok"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["pumpgrok"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["^vendor/", "^tests/", "^ci/", "^scripts/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "ci/tests"]
addopts = "-q --strict-markers"
markers = [
    "replay: runs against tests/fixtures/replay/<dataset>",
    "characterization: pins vendor behaviour during the port",
]
filterwarnings = ["error::DeprecationWarning:pumpgrok.*"]
