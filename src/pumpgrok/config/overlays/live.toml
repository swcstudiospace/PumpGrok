# Live profile. Declares live INTENT via execution.mode, but live stays
# disabled: [live] enabled = false and paper-equivalent risk values.
# Selected with PUMPGROK_PROFILE=live. The live gate evaluates the merged
# effective mode and refuses to start until every precondition is met.
# Risk here intentionally mirrors paper: raising limits is an operator
# overlay (PUMPGROK_CONFIG) decision, never a committed default.

[execution]
mode = "live"

[risk]
max_trade_fraction = "0.02"
max_token_fraction = "0.05"
daily_loss_halt_fraction = "0.05"
drawdown_halt_fraction = "0.15"
max_open_positions = 3
max_trades_per_day = 20
liquidity_floor_multiple = 10
partial_fill_fraction = "0.02"

[replay]
seed = 20260101

# Marker only: enabling live requires the live gate (separate module).
[live]
enabled = false
