# WHALE roster: 6 own tools + desk.* core eight (_core.yaml) = 14 effective.
# Contract surface: contracts/tool-rosters/** (bot-02-risk, ownership.yaml). Consumer: bot-03-whale.
# Least privilege: docs/ROSTER.md section 5 and 6; tool names from docs/TOOL_CATALOG.md.
version: 1.1.0
seat: bot-03-whale
short: whale
endpoint: /mcp/whale
scope: seat:whale
core: true
packs_allowed: false
consumers:
- bot-03-whale
tools:
- name: onchain.top_holders
  kind: read
  side_effect: read
  gates: []
  description: Top token accounts by amount with top-1, top-5 and top-10 shares. Curve and LP accounts
    are excluded by default. Read only.
  backend: onchain.top_holders
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      limit:
        type: integer
        minimum: 1
        maximum: 20
        default: 20
      exclude:
        type: array
        items:
          type: string
          minLength: 32
          maxLength: 44
        maxItems: 32
    required:
    - mint
- name: onchain.deployer_history
  kind: read
  side_effect: read
  gates: []
  description: Prior tokens and outcomes for a creator wallet over a lookback window. Read only.
  backend: onchain.deployer_history
  input:
    type: object
    additionalProperties: false
    properties:
      creator:
        type: string
        minLength: 32
        maxLength: 44
      lookback_days:
        type: integer
        minimum: 1
        maximum: 90
        default: 30
    required:
    - creator
- name: onchain.large_transfers
  kind: read
  side_effect: read
  gates: []
  description: Transfers above a share threshold by holders of a mint, classified as sell, transfer, lp_remove
    or unknown. Read only.
  backend: onchain.large_transfers
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      wallets:
        type: array
        items:
          type: string
          minLength: 32
          maxLength: 44
        maxItems: 50
      min_share:
        type: string
        pattern: ^[0-9]+(\.[0-9]+)?$
        default: '0.005'
      since_ts:
        type: integer
        minimum: 0
    required:
    - mint
- name: market.trades
  kind: read
  side_effect: read
  gates: []
  description: 'Recent trades for a mint: side, size, wallet and timestamp, with buy/sell ratio and unique
    wallet count. Read only.'
  backend: market.trades
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      limit:
        type: integer
        minimum: 1
        maximum: 200
        default: 200
      since_ts:
        type: integer
        minimum: 0
    required:
    - mint
- name: market.holders_snapshot
  kind: read
  side_effect: read
  gates: []
  description: Holder count, top holders and concentration for a mint. Read only.
  backend: market.holders_snapshot
  input:
    type: object
    additionalProperties: false
    properties:
      mint:
        type: string
        minLength: 32
        maxLength: 44
      limit:
        type: integer
        minimum: 1
        maximum: 50
        default: 50
    required:
    - mint
- name: journal.append
  kind: write
  side_effect: paper-write
  gates: []
  description: Append a smart-money signal to the ledger as a journal_note with note_kind whale. The body
    is validated against contracts/events/journal_note.schema.json.
  backend: journal.append
  input:
    type: object
    additionalProperties: false
    properties:
      kind:
        type: string
        enum:
        - journal_note
        description: 'Ledger kind: snake_case of an R32 type this seat may write.'
      note_kind:
        type: string
        enum:
        - whale
        description: Required when kind is journal_note.
      ticket_id:
        type: string
        pattern: ^SOL-[0-9]{8}-[0-9]{3}$
      body:
        type: object
        description: Payload for the kind; validated against its schema.
      approval_id:
        type: string
        minLength: 1
        maxLength: 128
        description: Human approval reference resolved to an ApprovalRecorded event (G-6).
      rollback_plan:
        type: string
        minLength: 1
        maxLength: 500
        description: How this write is undone or compensated if it is wrong.
    required:
    - kind
    - body
    allOf:
    - if:
        properties:
          kind:
            const: journal_note
        required:
        - kind
      then:
        required:
        - note_kind
manifest:
  id: bot-03-whale
  display: WHALE - Smart-Money Analyst
  channel: Trading Floor
  purpose: Holder quality and capital-flow analysis after RISK CLEAR/CONDITIONAL.
  inputs:
  - verdict event (must be CLEAR or CONDITIONAL)
  - onchain.top_holders
  - onchain.large_transfers
  - onchain.deployer_history
  - market.holders_snapshot
  - vendor priors (top5 share, creator share, wallet diversity)
  outputs:
  - Smart-Money signal event (JournalNote, note_kind whale)
  skills:
  - holder-and-flow-analysis
  - solana-market-data
  - discovery-tools
  - grokbot-pipeline
  - verification-receipts
  - rpc-hygiene
  - desk-doctor
  risk_budget:
    max_trade_fraction: 0
    max_token_fraction: 0
    daily_loss_halt_fraction: "0.05"
    drawdown_halt_fraction: "0.15"
    max_open_positions: 0
    max_trades_per_day: 0
    liquidity_floor_multiple: 10
    partial_fill_fraction: "0.02"
    paper_equity_sol: 10
  forbidden:
  - authorise a buy
  - override or upgrade a RISK KILL
  - treat social mentions as smart-money evidence
  - D7 manipulation actions
  fail_safe: 'onchain.top_holders unavailable: signal None with blind true; never
    skips live holder analysis because pipeline priors exist.'
  schedule:
  - kind: event
    expr: on verdict CLEAR or CONDITIONAL
  escalation:
  - To CHIEF plus RISK only
  owned_paths:
  - src/pumpgrok/tools/onchain/holders.py
  - src/pumpgrok/tools/onchain/transfers.py
  - skills/holder-and-flow-analysis/**
  - prompts/bot-03-whale.xml
  - tests/tools/onchain/test_holders*.py
  - tests/tools/onchain/test_transfers*.py
  - .receipts/bot-03-whale/**
  receipts_dir: .receipts/bot-03-whale/
  prompt_source: prompts/bot-03-whale.xml
  writes_to_exchange: false
