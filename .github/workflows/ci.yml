# CI: the canonical commands from the Makefile (make check: lint, typecheck, test, audit, drift).
#
# uv is installed through pip at the version that wrote uv.lock (0.13.4), so the lockfile is
# honoured exactly. Runners are GitHub-hosted (ubuntu-latest). Pull requests from forks are
# skipped on every job.
#
# The nightly schedule runs the slow soak suite only. PUMPGROK_REQUIRE_SOAK=1 makes
# a missing soak fixture fail instead of skipping, so the schedule proves the
# fixture is committed and green; PR runs are unaffected (slow tests run there too
# unless deselected, per the "slow tests are not deselected by default" rule).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (pinned to the version that wrote uv.lock)
        run: python -m pip install "uv==0.13.4"

      # Lint and tool settings live in pyproject.toml and the Makefile, which a pull request can
      # edit. On a pull request this job first overlays the base copies of both, so a PR cannot
      # weaken lint, typing or pytest settings and still pass; its own edits apply once merged.
      # Same trust model as the ci/gates overlay in gates.yml.
      - name: Use trusted lint and type config from base ref
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF"
          git checkout "origin/$BASE_REF" -- pyproject.toml Makefile
          echo "Trusted pyproject.toml and Makefile overlay from origin/$BASE_REF"

      - name: Lint, typecheck, test and audit
        run: make lint typecheck test audit

      - name: idle-grok
        run: uv run python ci/gates/check_idle_grok.py

      - name: Idle event desk makes zero Grok calls (G-8, EVT-12)
        run: make idle-grok

  soak:
    name: Nightly slow soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (pinned to the version that wrote uv.lock)
        run: python -m pip install "uv==0.13.4"

      - name: Slow soak with required fixture
        env:
          PUMPGROK_REQUIRE_SOAK: "1"
        run: uv run pytest -q -m slow tests/soak
