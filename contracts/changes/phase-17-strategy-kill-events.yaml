summary: >-
  Adds two event types for the strategy kill pair (RSK-02): StrategyKillSet, a human-set kill
  that refuses one strategy's buys and never its sells, and StrategyKillCleared, a human clear
  that consumes a killswitch_clear approval. Additive and non-breaking: no existing event schema
  changes, and the desk-wide KillSwitchSet and KillSwitchCleared are untouched. Version 1.2.0 is
  the next minor after 1.1.0 of contracts/changes/phase-3-seat-manifests.yaml, the latest change
  document whose surfaces include contracts/events/**.
