name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Установить зависимости
        run: |
          python -m pip install -U pip
          pip install -r requirements-dev.txt

      - name: Линтер
        run: ruff check .

      - name: Типы
        run: mypy src

      - name: Тесты
        run: pytest --cov=src --cov-report=term-missing

      - name: Плейсхолдеры в примере конфига отвергаются
        run: |
          if python -m src.pipeline --config config.example.yaml --check; then
            echo "config.example.yaml с плейсхолдерами не должен проходить проверку"
            exit 1
          fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Сборка образа
        run: docker build -t grokbot-pumpfun:ci .
      - name: Образ стартует и отвергает конфиг с плейсхолдерами
        run: |
          if docker run --rm grokbot-pumpfun:ci --config /app/config.example.yaml --check; then
            echo "образ принял конфиг без ключей — так быть не должно"
            exit 1
          fi
