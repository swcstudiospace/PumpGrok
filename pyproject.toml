[project]
name = "pumpgrok"
version = "0.1.0"
description = "PumpGrok: autonomously supervised, paper-trading-by-default Solana memecoin desk (pump.fun / Jupiter / Solana RPC / x.ai Grok)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Spectrum Web Co LLC" }]
dependencies = [
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.1,<3",
    "httpx>=0.28.1,<0.29",
    "websockets>=17.3,<18",
    "pyyaml>=6.0.3,<7",
    "tenacity>=9.2.1,<10",
    "prometheus-client>=0.26,<0.27",
    "defusedxml>=0.7.1,<0.8",
]

[project.scripts]
pumpgrok = "pumpgrok.cli:main"

[project.urls]
Homepage = "https://github.com/swcstudiospace/PumpGrok"
Repository = "https://github.com/swcstudiospace/PumpGrok"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pumpgrok"
module-root = "src"

[dependency-groups]
dev = [
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4.0,<3",
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "pip-audit>=2.10.1,<3",
    "types-PyYAML>=6.0.12.20260906",
    "hypothesis>=6.170.14,<7.0.0",
    "mutmut>=3.8.1,<4.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "ci"]
extend-exclude = ["vendor", "prompts-assembled", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF", "S", "T20", "PL", "C901", "PLR0912", "PLR0915"]
ignore = [
    "PLR0913",  # many-argument constructors on pydantic settings models
    "PLR2004",  # magic values are named constants in risk/ already; tests compare literals
    "S101",     # assert is the pytest idiom; bandit still runs in security-pr.yml
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20", "PLR"]
"ci/**" = ["T20", "S603", "S607"]
"scripts/**" = ["T20"]
"src/pumpgrok/replay/rng.py" = ["S311"]  # FOUND-012/R27: seeded deterministic replay RNG, never crypto
# Legacy C901 baseline (D-14, QLT-03): files measured after the hotspot splits. The baseline only
# shrinks; ci/tests/test_complexity_ratchet.py fails on any entry added here. Remove an entry when
# its file passes C901 (mccabe max-complexity 10).
"ci/gates/check_desk_integrity.py" = ["C901"]
"ci/gates/check_receipt.py" = ["C901"]
"ci/gates/check_secrets.py" = ["C901"]
"ci/tests/test_gates.py" = ["C901"]
"scripts/generate-event-schemas.py" = ["C901"]
"scripts/generate-templates.py" = ["C901"]
"services/desk-gateway/src/desk_gateway/server.py" = ["C901"]
"src/pumpgrok/engine/agents/base.py" = ["C901"]
"src/pumpgrok/engine/monitor.py" = ["C901"]
"src/pumpgrok/replay/runner.py" = ["C901"]
"src/pumpgrok/risk/breakers.py" = ["C901"]
"src/pumpgrok/supervisor/metrics.py" = ["C901"]
"src/pumpgrok/tools/onchain/large_transfers.py" = ["C901"]
"src/pumpgrok/tools/risk/halt_status.py" = ["C901"]
"tests/docs/test_runbook_commands.py" = ["C901"]
"tests/harness/faults.py" = ["C901"]
"tests/risk/test_check_order_caps.py" = ["C901"]
"tests/safety/test_import_graph_no_live.py" = ["C901"]
"tests/safety/test_money_types.py" = ["C901"]
"tests/safety/test_no_eval_or_shell.py" = ["C901"]
"tests/safety/test_static_guards.py" = ["C901"]
"tests/tools/onchain/test_onchain_reads.py" = ["C901"]

[tool.ruff.lint.isort]
known-first-party = ["pumpgrok"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-branches = 12
max-statements = 50

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["pumpgrok"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
exclude = ["^vendor/", "^tests/", "^ci/", "^scripts/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "ci/tests"]
addopts = "-q --strict-markers -m 'not slow'"
markers = [
    "replay: runs against tests/fixtures/replay/<dataset>",
    "characterization: pins vendor behaviour during the port",
    "slow: multi-day soak replay (nightly; PUMPGROK_REQUIRE_SOAK=1 makes absence fail)",
]
filterwarnings = ["error::DeprecationWarning:pumpgrok.*"]

[tool.coverage.run]
source = ["pumpgrok"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 89.9
