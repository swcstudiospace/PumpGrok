rationale: >-
  B6 option (a), approved by the user (ask: roster, Approve the additive
  version bump): the roster YAML could not load as BotManifest, so each seat
  roster carries an additive manifest block with the same field list as
  ROSTER section 5 (id, display, channel, purpose, inputs, outputs, skills,
  risk_budget, forbidden, fail_safe, schedule, escalation, owned_paths,
  receipts_dir, prompt_source, writes_to_exchange). allowed_tools is derived
  by the loader from the roster tools list plus _core, so tool names stay in
  exactly one place. The 1.0.0 to 1.1.0 bump marks the additive contract
  change; G-4 acknowledgements from all ten seat consumers are PENDING (human
  checkpoint recorded below). RISK and RUG stay at 15 effective tools each.
  B3 reading: chief keeps portfolio.exposure, exec.positions and
  portfolio.pnl as read tools; TOOL-009 "no exposure tools" means no
  exposure-creating tools (exec.place, exec.cancel, market.*), which chief
  does not hold. One-way roster contract change.
b3_reading: >-
  Chief retains portfolio.exposure, exec.positions and portfolio.pnl as READ
  grants (desk-monitoring requires them; ROSTER section 6 matrix). TOOL-009
  "chief has no exposure tools" is read as no exposure-creating tools:
  chief resolves no exec.place, exec.cancel, or market.* tool.
