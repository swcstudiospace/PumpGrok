# Bandit config for the security PR gate (.github/workflows/security-pr.yml).
# Invoked from the workflow as: bandit -r . --ini ci/security/bandit.ini -lll (see the workflow).
#
# -lll (set on the CLI, not here) raises the reported severity floor to HIGH only, so the PR
# gate fails on HIGH+ without drowning in LOW/MEDIUM noise on every PR.
[bandit]
exclude_dirs = tests,vendor,node_modules,.venv,venv,__pycache__,.git
