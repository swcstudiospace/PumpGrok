summary: >-
  Additive seat-manifest blocks (B6 option a): each of the ten seat roster
  files gains a manifest block that loads as BotManifest, and every roster
  file (ten seats plus _core) bumps version 1.0.0 to 1.1.0. No tool name,
  grant, or side_effect changes; R35 effective counts hold.
reversibility: one-way
