# CI: the canonical commands from the Makefile (lint, typecheck, test, audit).
#
# uv is installed through pip at the version that wrote uv.lock (0.13.4), so the lockfile is
# honoured exactly. Runners are GitHub-hosted (ubuntu-latest).
#
# The nightly schedule runs the slow soak suite only. PUMPGROK_REQUIRE_SOAK=1 makes
# a missing soak fixture fail instead of skipping, so the schedule proves the
# fixture is committed and green; PR runs are unaffected (slow tests run there too
# unless deselected, per the "slow tests are not deselected by default" rule).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (pinned to the version that wrote uv.lock)
        run: pip install "uv==0.13.4"

      - name: Lint, typecheck, test and audit
        run: make lint typecheck test audit

  soak:
    name: Nightly slow soak
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv (pinned to the version that wrote uv.lock)
        run: pip install "uv==0.13.4"

      - name: Slow soak with required fixture
        env:
          PUMPGROK_REQUIRE_SOAK: "1"
        run: uv run pytest -q -m slow tests/soak
